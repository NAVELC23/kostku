services:
  # Container aplikasi Laravel (PHP)
  app:
    build: .
    container_name: kostku-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - app-code:/var/www
    depends_on:
      - db
    networks:
      - kostku-net

  # Container web server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: kostku-webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - app-code:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kostku-net

  # Container database (MySQL)
  db:
    image: mysql:8.0
    container_name: kostku-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kostku
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - kostku-dbdata:/var/lib/mysql
    networks:
      - kostku-net

networks:
  kostku-net:
    driver: bridge

volumes:
  kostku-dbdata:
  app-code: